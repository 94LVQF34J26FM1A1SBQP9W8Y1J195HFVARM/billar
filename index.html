<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billar Pro - Lobby</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        arbzerDark: '#0b0c1b',
                        arbzerPanel: '#13152d',
                        arbzerPanelLight: '#1c1e40',
                        arbzerGold: '#d4af37',
                        arbzerPurple: '#3b255e'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-arbzerDark text-white font-sans h-screen overflow-hidden flex flex-col select-none">

    <!-- Auth Modal -->
    <div id="authScreen" class="absolute inset-0 z-50 bg-arbzerDark flex items-center justify-center">
        <div class="bg-arbzerPanel p-8 rounded-xl shadow-2xl w-96 border border-arbzerPanelLight">
            <h2 class="text-2xl font-bold text-center mb-6">Acceso al Servidor</h2>
            <input type="email" id="email" placeholder="Correo" class="w-full bg-arbzerDark text-white p-3 rounded mb-3 border border-arbzerPanelLight outline-none focus:border-indigo-500">
            <input type="password" id="password" placeholder="Contraseña" class="w-full bg-arbzerDark text-white p-3 rounded mb-4 border border-arbzerPanelLight outline-none focus:border-indigo-500">
            <button onclick="login()" class="w-full bg-indigo-600 hover:bg-indigo-700 p-3 rounded font-bold mb-2 transition">Ingresar</button>
            <button onclick="register()" class="w-full bg-arbzerPanelLight hover:bg-slate-700 p-3 rounded font-bold transition">Registrar Cuenta</button>
        </div>
    </div>

    <!-- Top Header -->
    <header class="h-14 bg-arbzerPanel border-b border-arbzerPanelLight flex items-center justify-between px-6 shrink-0">
        <div class="flex items-center gap-4 text-gray-400">
            <button class="hover:text-white transition"><i class="fa-solid fa-headset text-xl"></i></button>
        </div>
        <div class="flex flex-col items-center">
            <span class="text-xl font-black tracking-widest text-transparent bg-clip-text bg-gradient-to-r from-yellow-400 to-yellow-600">BILLAR PRO</span>
        </div>
        <div class="flex items-center gap-4 text-gray-400">
            <button class="w-8 h-8 rounded bg-arbzerPanelLight hover:text-white transition"><i class="fa-regular fa-envelope"></i></button>
            <button class="w-8 h-8 rounded bg-arbzerPanelLight hover:text-white transition"><i class="fa-solid fa-search"></i></button>
            <button onclick="logout()" class="w-8 h-8 rounded bg-arbzerPanelLight hover:text-white transition"><i class="fa-solid fa-sign-out-alt"></i></button>
        </div>
    </header>

    <!-- Main Layout -->
    <div id="mainLobby" class="flex flex-1 overflow-hidden hidden">
        
        <!-- Left Sidebar: Leaderboards -->
        <aside class="w-80 bg-arbzerPanel border-r border-arbzerPanelLight flex flex-col">
            <div class="flex text-xs font-bold bg-arbzerDark p-1 m-2 rounded">
                <button onclick="switchTab('topPlayers')" id="tabTopPlayers" class="flex-1 py-2 rounded bg-arbzerPurple text-white transition">Mejores Jugadores</button>
                <button onclick="switchTab('topContestants')" id="tabTopContestants" class="flex-1 py-2 rounded text-gray-400 hover:text-white transition">Mejores concursantes</button>
            </div>
            
            <div id="contentTopPlayers" class="flex-1 overflow-y-auto p-4 space-y-2">
                <div class="bg-arbzerPanelLight rounded-lg p-4 mb-4 flex items-center justify-between">
                    <div>
                        <h3 class="text-lg font-black"><i class="fa-solid fa-trophy text-arbzerGold mr-2"></i> 100 MEJORES</h3>
                        <p class="text-[10px] text-gray-400">SALÓN DE LA FAMA</p>
                    </div>
                </div>
                <!-- Lista en 0 -->
                <ul id="leaderboardList" class="space-y-2 text-sm text-gray-500 text-center mt-10">
                    <li>No hay datos registrados aún</li>
                </ul>
            </div>
            
            <div id="contentTopContestants" class="flex-1 overflow-y-auto p-4 hidden">
                <p class="text-sm text-gray-500 text-center mt-10">Sin concursantes activos</p>
            </div>
        </aside>

        <!-- Center: Banner & Profile -->
        <main class="flex-1 flex flex-col p-4 gap-4 overflow-y-auto bg-arbzerDark">
            <!-- Event Banner -->
            <div class="h-48 rounded-xl bg-arbzerPanelLight relative overflow-hidden flex items-center justify-center border border-arbzerPanelLight">
                <h2 class="text-3xl font-black text-gray-600">ÁREA DE EVENTOS Y BANNERS</h2>
            </div>

            <!-- Profile Info -->
            <div class="bg-arbzerPanel rounded-xl border border-arbzerPanelLight p-6 flex flex-col items-center">
                <div class="w-20 h-20 rounded-full border-2 border-indigo-500 flex items-center justify-center bg-arbzerDark mb-3 shadow-[0_0_15px_rgba(99,102,241,0.3)]">
                    <i class="fa-solid fa-user-ninja text-3xl text-indigo-400"></i>
                </div>
                <h2 id="profileName" class="text-xl font-bold text-white mb-1">Cargando...</h2>
                <p id="profileId" class="text-xs text-gray-500 mb-6">@ID</p>
                
                <div class="w-full max-w-md bg-arbzerDark rounded-full h-1.5 mb-2 relative">
                    <div id="xpBar" class="bg-indigo-600 h-1.5 rounded-full absolute top-0 left-0" style="width: 0%"></div>
                </div>
                <div class="w-full max-w-md flex justify-between text-[10px] text-gray-400 font-bold uppercase">
                    <span id="profileLevel"><i class="fa-solid fa-bolt text-indigo-500"></i> NIVEL 0</span>
                    <span id="profileXp">0 / 500 XP</span>
                </div>
            </div>
        </main>

        <!-- Right Sidebar: Rooms -->
        <aside class="w-80 bg-arbzerPanel border-l border-arbzerPanelLight flex flex-col">
            <div class="p-4 border-b border-arbzerPanelLight">
                <h3 class="text-xs font-bold text-gray-300 mb-3 uppercase tracking-wider">Lista de Habitaciones</h3>
                <div class="flex gap-1 text-xs">
                    <button class="flex-1 bg-arbzerDark py-2 rounded text-gray-400 hover:text-white transition"><i class="fa-solid fa-users"></i></button>
                    <button class="flex-1 bg-arbzerDark py-2 rounded text-gray-400 hover:text-white transition"><i class="fa-solid fa-location-dot"></i></button>
                    <button class="flex-[2] bg-emerald-500 py-2 rounded text-white font-bold hover:bg-emerald-600 transition"><i class="fa-solid fa-globe mr-1"></i> PÚBLICO</button>
                </div>
            </div>
            <div id="roomList" class="flex-1 overflow-y-auto p-2 space-y-1">
                <!-- Salas generadas dinámicamente -->
            </div>
        </aside>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgh5vREimBuNfQ2fJACahZyfze3upFNKg",
            authDomain: "billar-gz.firebaseapp.com",
            databaseURL: "https://billar-gz-default-rtdb.firebaseio.com",
            projectId: "billar-gz"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // Control de Pestañas Fluidas
        function switchTab(tab) {
            document.getElementById('tabTopPlayers').classList.replace(tab === 'topPlayers' ? 'bg-arbzerDark' : 'bg-arbzerPurple', tab === 'topPlayers' ? 'bg-arbzerPurple' : 'bg-arbzerDark');
            document.getElementById('tabTopPlayers').classList.toggle('text-white', tab === 'topPlayers');
            document.getElementById('tabTopPlayers').classList.toggle('text-gray-400', tab !== 'topPlayers');
            
            document.getElementById('tabTopContestants').classList.replace(tab === 'topContestants' ? 'bg-arbzerDark' : 'bg-arbzerPurple', tab === 'topContestants' ? 'bg-arbzerPurple' : 'bg-arbzerDark');
            document.getElementById('tabTopContestants').classList.toggle('text-white', tab === 'topContestants');
            document.getElementById('tabTopContestants').classList.toggle('text-gray-400', tab !== 'topContestants');

            document.getElementById('contentTopPlayers').classList.toggle('hidden', tab !== 'topPlayers');
            document.getElementById('contentTopContestants').classList.toggle('hidden', tab !== 'topContestants');
        }

        function login() {
            auth.signInWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value).catch(err => alert(err.message));
        }

        function register() {
            auth.createUserWithEmailAndPassword(document.getElementById('email').value, document.getElementById('password').value)
                .then(cred => {
                    db.ref('usuarios/' + cred.user.uid).set({ nombre: 'Nuevo Jugador', nivel: 0, xp: 0 });
                }).catch(err => alert(err.message));
        }

        function logout() { auth.signOut(); }

        auth.onAuthStateChanged(user => {
            if (user) {
                document.getElementById('authScreen').classList.add('hidden');
                document.getElementById('mainLobby').classList.remove('hidden');
                
                // Cargar perfil en 0
                db.ref('usuarios/' + user.uid).on('value', snap => {
                    const data = snap.val() || { nombre: 'Jugador', nivel: 0, xp: 0 };
                    document.getElementById('profileName').innerText = data.nombre;
                    document.getElementById('profileId').innerText = '@' + user.uid.substring(0, 10);
                    document.getElementById('profileLevel').innerHTML = `<i class="fa-solid fa-bolt text-indigo-500"></i> NIVEL ${data.nivel}`;
                    document.getElementById('profileXp').innerText = `${data.xp} / 500 XP`;
                    document.getElementById('xpBar').style.width = `${(data.xp / 500) * 100}%`;
                });

                cargarSalas();
            } else {
                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('mainLobby').classList.add('hidden');
            }
        });

        function cargarSalas() {
            db.ref('salas').on('value', snap => {
                const list = document.getElementById('roomList');
                list.innerHTML = '';
                snap.forEach(child => {
                    const s = child.val();
                    list.innerHTML += `
                        <div onclick="window.location.href='room.html?id=${child.key}'" class="flex items-center justify-between p-2 hover:bg-arbzerPanelLight cursor-pointer rounded border border-transparent hover:border-indigo-900 transition group">
                            <div class="flex items-center gap-3">
                                <div class="w-8 h-8 rounded bg-arbzerDark flex items-center justify-center text-arbzerGold">
                                    <i class="fa-solid fa-trophy text-xs"></i>
                                </div>
                                <div>
                                    <h4 class="text-xs font-bold text-white group-hover:text-indigo-300 transition">${s.nombre}</h4>
                                    <p class="text-[10px] text-gray-500">${s.tipo || 'General'}</p>
                                </div>
                            </div>
                            <div class="text-[10px] text-gray-500 font-bold"><i class="fa-solid fa-user mr-1"></i> ${s.usuariosCount || 0}</div>
                        </div>
                    `;
                });
            });
        }
    </script>
</body>
</html>
