        <script>
            // 1. Inicializar Firebase
            const firebaseConfig = {
                apiKey: "AIzaSyBgh5vREimBuNfQ2fJACahZyfze3upFNKg",
                authDomain: "billar-gz.firebaseapp.com",
                databaseURL: "https://billar-gz-default-rtdb.firebaseio.com",
                projectId: "billar-gz",
                storageBucket: "billar-gz.firebasestorage.app",
                messagingSenderId: "897124469055",
                appId: "1:897124469055:web:f19b6b8aad429ea9036b8a",
                measurementId: "G-F2Z6NLG3Z7"
            };
            firebase.initializeApp(firebaseConfig);
            const db = firebase.database();
            let currentRoomId = null;

            // 2. Autenticación y Matchmaking
            function iniciarSesionYBuscarSala() {
                firebase.auth().signInAnonymously()
                    .then(() => {
                        console.log("Autenticado con éxito UID:", firebase.auth().currentUser.uid);
                        buscarSalaDisponible();
                    })
                    .catch((error) => console.error("Error Auth:", error));
            }

            function buscarSalaDisponible() {
                db.ref('salas').orderByChild('estado').equalTo('esperando').limitToFirst(1).once('value', snapshot => {
                    if (snapshot.exists()) {
                        snapshot.forEach(child => {
                            currentRoomId = child.key;
                            unirseASala(currentRoomId);
                        });
                    } else {
                        console.log("No hay salas disponibles. Esperando en el menú.");
                    }
                });
            }

            function unirseASala(roomId) {
                db.ref('salas/' + roomId).update({ 
                    estado: 'en_juego', 
                    jugador2: firebase.auth().currentUser.uid 
                });
                escucharTiros(roomId);
                console.log("Unido a la sala:", roomId);
            }

            // 3. Escuchar tiros del oponente
            function escucharTiros(roomId) {
                db.ref('salas/' + roomId + '/tiro_actual').on('value', (snapshot) => {
                    const datosTiro = snapshot.val();
                    if (datosTiro && datosTiro.jugador !== firebase.auth().currentUser.uid) {
                        console.log("Tiro recibido del oponente:", datosTiro);
                        // Aquí deberás llamar a la función interna de tu motor físico para replicar el tiro
                    }
                });
            }

            // 4. Función global para enviar tiros (Llamar desde tu CStick.js)
            window.enviarTiroMultijugador = function(fuerza, angulo, efectoX, efectoY) {
                if(currentRoomId) {
                    db.ref('salas/' + currentRoomId + '/tiro_actual').set({
                        jugador: firebase.auth().currentUser.uid,
                        fuerza: fuerza,
                        angulo: angulo,
                        efectoX: efectoX,
                        efectoY: efectoY,
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            };

            // Iniciar conexión al cargar
            $(document).ready(function(){
                iniciarSesionYBuscarSala();
            });
        </script>

    <body ondragstart="return false;" ondrop="return false;" >
	<div style="position: fixed; background-color: transparent; top: 0px; left: 0px; width: 100%; height: 100%"></div>
          <script>
            $(document).ready(function(){
                     var oMain = new CMain({
                                                audio_enable_on_startup:false, 
                                                fullscreen:true,   
                                                check_orientation:true, 
                                                points_for_ball_pot: 20, 
                                                points_for_fault: -40 
                                        });
                     
                     $(oMain).on("start_session", function(evt) {
                            if(getParamValue('ctl-arcade') === "true"){
                                parent.__ctlArcadeStartSession();
                            }
                     });
                     
                    $(oMain).on("end_session", function(evt) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeEndSession();
                           }
                    });

                    $(oMain).on("save_score", function(evt,iScore) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeSaveScore({score:iScore});
                           }
                    });

                    $(oMain).on("start_level", function(evt, iLevel) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeStartLevel({level:iLevel});
                           }
                    });

                    $(oMain).on("end_level", function(evt, iLevel) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeEndLevel({level:iLevel});
                           }
                    });
                    
                    $(oMain).on("restart_level", function (evt, iLevel) {
                        if (getParamValue('ctl-arcade') === "true") {
                            parent.__ctlArcadeRestartLevel({level: iLevel});
                        }
                    });
                    
                    $(oMain).on("show_interlevel_ad", function(evt) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeShowInterlevelAD();
                           }
                    });
                    
                    $(oMain).on("share_event", function(evt, iScore) {
                           if(getParamValue('ctl-arcade') === "true"){
                               parent.__ctlArcadeShareEvent({   img: TEXT_SHARE_IMAGE,
                                                                title: TEXT_SHARE_TITLE,
                                                                msg: TEXT_SHARE_MSG1 + iScore + TEXT_SHARE_MSG2,
                                                                msg_share: TEXT_SHARE_SHARE1 + iScore
                                                            });                          
                           }
                    });
					 
                    if(isIOS()){
                        setTimeout(function(){sizeHandler();},200); 
                    }else{ 
                        sizeHandler(); 
                    } 
           });
        </script>
