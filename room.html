<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Juego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        roomDark: '#0a0d20',
                        roomPanel: '#11152a',
                        roomBorder: '#1a1f3a',
                        textDim: '#6b7280'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-roomDark text-white h-screen flex overflow-hidden font-sans select-none">

    <!-- Left Sidebar: Users -->
    <aside class="w-72 bg-roomPanel border-r border-roomBorder flex flex-col shrink-0">
        <div class="h-14 border-b border-roomBorder flex justify-between items-center px-4">
            <button onclick="window.location.href='index.html'" class="bg-red-950 text-red-500 border border-red-900 px-3 py-1.5 rounded text-xs font-bold hover:bg-red-900 transition flex items-center gap-2">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> DEJAR
            </button>
            <button class="bg-indigo-950 text-indigo-400 border border-indigo-900 px-3 py-1.5 rounded text-xs font-bold hover:bg-indigo-900 transition flex items-center gap-2">
                <i class="fa-solid fa-swords"></i> Desafío <i class="fa-solid fa-chevron-down text-[10px]"></i>
            </button>
        </div>
        
        <!-- Current User Profile -->
        <div class="p-4 border-b border-roomBorder flex gap-3 items-center bg-roomDark/50">
            <div class="w-10 h-10 rounded bg-roomDark border border-cyan-500 flex items-center justify-center">
                <i class="fa-solid fa-user-ninja text-cyan-400"></i>
            </div>
            <div>
                <h3 id="miNombre" class="font-bold text-red-400 text-sm">Cargando...</h3>
                <p id="miId" class="text-[10px] text-gray-500">IDENTIFICACIÓN: ...</p>
                <div class="flex items-center gap-1 mt-1 text-[10px] font-bold text-orange-400">
                    <i class="fa-solid fa-star"></i> 0
                </div>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-2" id="listaUsuarios">
            <!-- Lista en cero dinámicamente poblada -->
        </div>
    </aside>

    <!-- Center: Game / Settings Tabs -->
    <main class="flex-1 flex flex-col relative bg-[#0b0f24]">
        <!-- Independent Tabs -->
        <div class="h-14 bg-roomPanel border-b border-roomBorder flex shrink-0">
            <button onclick="switchCenterTab('gameTab')" id="btnGameTab" class="flex-1 border-b-2 border-purple-500 text-purple-400 font-bold text-xs bg-roomDark/30 flex items-center justify-center gap-2 transition">
                <i class="fa-solid fa-gamepad"></i> JUEGOS ACTIVOS
            </button>
            <button onclick="switchCenterTab('settingsTab')" id="btnSettingsTab" class="flex-1 text-gray-500 font-bold text-xs hover:text-gray-300 flex items-center justify-center gap-2 transition border-b-2 border-transparent">
                <i class="fa-solid fa-sliders"></i> MIS AJUSTES
            </button>
        </div>
        
        <!-- Game Area (Empty State) -->
        <div id="contentGameTab" class="flex-1 flex flex-col items-center justify-center">
            <div class="w-16 h-16 bg-roomPanel rounded-xl flex items-center justify-center mb-4 border border-roomBorder shadow-lg">
                <i class="fa-solid fa-swords text-2xl text-indigo-500/50"></i>
            </div>
            <h2 class="text-lg font-bold mb-1">No hay coincidencias activas actualmente</h2>
            <p class="text-xs text-textDim">Inicia un desafío para aparecer aquí</p>
        </div>

        <!-- Settings Area -->
        <div id="contentSettingsTab" class="flex-1 flex flex-col items-center justify-center hidden">
            <h2 class="text-lg font-bold mb-1 text-gray-400">Ajustes del Juego</h2>
            <p class="text-xs text-textDim">Configuraciones en construcción</p>
        </div>
    </main>

    <!-- Right Sidebar: Chat (30 lines logic & timestamps) -->
    <aside class="w-80 bg-roomPanel border-l border-roomBorder flex flex-col shrink-0">
        <div class="h-14 border-b border-roomBorder flex items-center justify-between px-4 shrink-0">
            <div class="flex items-center gap-2 text-textDim text-xs font-bold">
                <i class="fa-solid fa-users"></i> <span id="usersCount">0</span>
            </div>
            <div class="flex gap-4 text-textDim">
                <button class="hover:text-white transition"><i class="fa-solid fa-music"></i></button>
                <button class="hover:text-white transition"><i class="fa-solid fa-hand-paper"></i></button>
                <button class="hover:text-white transition"><i class="fa-solid fa-volume-xmark"></i></button>
            </div>
        </div>

        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="chatBox">
            <!-- Rules (Static UI) -->
            <div class="text-center mb-6">
                <i class="fa-solid fa-shield text-arbzerGold text-xl mb-2"></i>
                <h4 class="font-bold text-xs text-gray-300">Reglas de chat</h4>
            </div>
            <div class="bg-roomDark border border-roomBorder rounded p-3 text-right">
                <div class="flex justify-end items-center gap-2 mb-1">
                    <span class="text-[10px] font-bold text-gray-300">El respeto es obligatorio</span>
                    <span class="w-4 h-4 rounded bg-roomPanel text-[9px] flex items-center justify-center text-gray-400">1</span>
                </div>
                <p class="text-[9px] text-gray-500">Cualquier insulto = prohibición inmediata y sin previo aviso.</p>
            </div>
            <!-- Mensajes inician en cero -->
        </div>

        <!-- Chat Input Form -->
        <div class="p-3 border-t border-roomBorder bg-roomDark shrink-0">
            <form onsubmit="enviarMensaje(event)" class="relative flex items-center">
                <button type="button" class="absolute left-3 text-gray-500"><i class="fa-solid fa-microphone text-xs"></i></button>
                <input type="text" id="chatInput" autocomplete="off" placeholder="Escribe aquí..." class="w-full bg-roomPanel text-xs text-white rounded-full py-2.5 pl-9 pr-10 outline-none border border-roomBorder focus:border-indigo-500 transition">
                <button type="submit" class="absolute right-3 text-indigo-500 hover:text-indigo-400"><i class="fa-solid fa-paper-plane text-xs"></i></button>
            </form>
        </div>
    </aside>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgh5vREimBuNfQ2fJACahZyfze3upFNKg",
            authDomain: "billar-gz.firebaseapp.com",
            databaseURL: "https://billar-gz-default-rtdb.firebaseio.com",
            projectId: "billar-gz"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const roomId = new URLSearchParams(window.location.search).get('id');

        if(!roomId) window.location.href = 'index.html';

        // Pestañas Centrales Independientes (Sin Lag)
        function switchCenterTab(tab) {
            const isGame = tab === 'gameTab';
            document.getElementById('btnGameTab').className = isGame 
                ? 'flex-1 border-b-2 border-purple-500 text-purple-400 font-bold text-xs bg-roomDark/30 flex items-center justify-center gap-2 transition' 
                : 'flex-1 border-b-2 border-transparent text-gray-500 font-bold text-xs hover:text-gray-300 flex items-center justify-center gap-2 transition';
            
            document.getElementById('btnSettingsTab').className = !isGame 
                ? 'flex-1 border-b-2 border-purple-500 text-purple-400 font-bold text-xs bg-roomDark/30 flex items-center justify-center gap-2 transition' 
                : 'flex-1 border-b-2 border-transparent text-gray-500 font-bold text-xs hover:text-gray-300 flex items-center justify-center gap-2 transition';

            document.getElementById('contentGameTab').classList.toggle('hidden', !isGame);
            document.getElementById('contentSettingsTab').classList.toggle('hidden', isGame);
        }

        auth.onAuthStateChanged(user => {
            if (!user) { window.location.href = 'index.html'; return; }
            
            db.ref('usuarios/' + user.uid).once('value').then(snap => {
                const data = snap.val() || { nombre: 'Jugador' };
                document.getElementById('miNombre').innerText = data.nombre;
                document.getElementById('miId').innerText = 'ID: ' + user.uid.substring(0, 10);
                
                const presenceRef = db.ref(`salas/${roomId}/jugadores/${user.uid}`);
                presenceRef.set({ nombre: data.nombre, timestamp: firebase.database.ServerValue.TIMESTAMP });
                presenceRef.onDisconnect().remove();
            });

            iniciarChat(user);
        });

        // Lógica de Chat: Hora + Límite de 30 líneas
        function enviarMensaje(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            if(input.value.trim() === '') return;
            
            const chatRef = db.ref(`salas/${roomId}/chat`);
            chatRef.push({
                uid: auth.currentUser.uid,
                nombre: document.getElementById('miNombre').innerText,
                mensaje: input.value,
                timestamp: Date.now() // Captura la hora actual
            });
            input.value = '';

            // Limpieza en servidor para no acumular datos:
            // Borra los mensajes antiguos si superan los 30 en la base de datos
            chatRef.once('value').then(snap => {
                if(snap.numChildren() > 30) {
                    let i = 0;
                    const excedente = snap.numChildren() - 30;
                    snap.forEach(child => {
                        if(i < excedente) chatRef.child(child.key).remove();
                        i++;
                    });
                }
            });
        }

        function formatTime(ts) {
            const date = new Date(ts);
            return date.toLocaleTimeString('es-PE', { hour: '2-digit', minute: '2-digit' });
        }

        function iniciarChat(user) {
            const box = document.getElementById('chatBox');
            // Solo descarga los últimos 30 para garantizar fluidez y cumplimiento de regla
            db.ref(`salas/${roomId}/chat`).limitToLast(30).on('child_added', snap => {
                const msg = snap.val();
                const isMe = msg.uid === user.uid;
                const align = isMe ? 'text-right' : 'text-left';
                const color = isMe ? 'text-indigo-400' : 'text-emerald-400';
                
                // Crea el elemento del mensaje con la hora
                const msgDiv = document.createElement('div');
                msgDiv.className = `${align} mb-2 chat-line`;
                msgDiv.innerHTML = `
                    <div class="flex items-baseline ${isMe ? 'justify-end' : 'justify-start'} gap-2">
                        <span class="${color} text-[10px] font-bold">${msg.nombre}</span>
                        <span class="text-[8px] text-gray-600">${formatTime(msg.timestamp)}</span>
                    </div>
                    <p class="text-xs text-gray-300 bg-roomDark inline-block py-1.5 px-3 rounded-lg max-w-[90%] break-words mt-0.5 border border-roomBorder shadow-sm">${msg.mensaje}</p>
                `;
                
                box.appendChild(msgDiv);
                
                // Limpieza del DOM: Asegurar visualmente que nunca pase de 30 líneas (incluyendo las reglas que son 2 divs)
                const lines = box.getElementsByClassName('chat-line');
                if (lines.length > 30) {
                    lines[0].remove();
                }
                
                box.scrollTop = box.scrollHeight;
            });
        }
    </script>
</body>
</html>
