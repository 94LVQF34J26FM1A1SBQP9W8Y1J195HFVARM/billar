<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sala de Juego</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { bgDark: '#0a0f24', panelDark: '#111827', accent: '#6366f1' } } }
        }
    </script>
</head>
<body class="bg-bgDark text-white h-screen flex overflow-hidden font-sans">

    <!-- Sidebar Izquierda: Usuarios en la sala -->
    <aside class="w-72 bg-panelDark border-r border-slate-800 flex flex-col">
        <div class="p-4 border-b border-slate-800 flex justify-between items-center">
            <button onclick="salirSala()" class="bg-red-900/30 text-red-500 border border-red-900 px-4 py-2 rounded text-sm hover:bg-red-900/50 transition"><i class="fa-solid fa-arrow-right-from-bracket"></i> DEJAR</button>
            <button class="bg-indigo-900/30 text-indigo-400 border border-indigo-900 px-4 py-2 rounded text-sm hover:bg-indigo-900/50 transition"><i class="fa-solid fa-swords"></i> Desafío</button>
        </div>
        <!-- Perfil Usuario Actual -->
        <div class="p-4 border-b border-slate-800 flex gap-4 items-center bg-slate-900/50">
            <div class="w-12 h-12 rounded bg-slate-800 border-2 border-cyan-500 overflow-hidden">
                <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=ZMATEO" class="w-full h-full">
            </div>
            <div>
                <h3 id="miNombre" class="font-bold text-red-400 text-sm">Z MATEO</h3>
                <p id="miId" class="text-[10px] text-gray-500">IDENTIFICACIÓN: Cargando...</p>
            </div>
        </div>
        <!-- Lista de Usuarios en Sala -->
        <div class="flex-1 overflow-y-auto p-2" id="usuariosEnSala"></div>
    </aside>

    <!-- Centro: Área de Juego/Desafíos -->
    <main class="flex-1 flex flex-col relative bg-[#0d122b]">
        <!-- Tabs Superiores -->
        <div class="h-14 bg-panelDark border-b border-slate-800 flex">
            <button class="flex-1 border-b-2 border-purple-500 text-purple-400 font-bold text-sm bg-slate-800/50"><i class="fa-solid fa-gamepad"></i> JUEGOS ACTIVOS</button>
            <button class="flex-1 text-gray-500 font-bold text-sm hover:text-gray-300"><i class="fa-solid fa-sliders"></i> MIS AJUSTES</button>
        </div>
        
        <!-- Centro Vacío / Contenedor del Juego HTML5 -->
        <div class="flex-1 flex flex-col items-center justify-center opacity-50">
            <div class="w-16 h-16 bg-slate-800 rounded-xl flex items-center justify-center mb-4">
                <i class="fa-solid fa-swords text-2xl text-slate-600"></i>
            </div>
            <h2 class="text-xl font-bold mb-2">No hay coincidencias activas actualmente</h2>
            <p class="text-sm text-gray-400">Inicia un desafío para aparecer aquí</p>
            
            <!-- AQUI SE INSERTARÁ TU CANVAS HTML5 CUANDO INICIE EL JUEGO -->
            <div id="gameContainer" class="absolute inset-0 hidden bg-black z-50">
                <!-- <canvas id="canvas_game"...> -->
            </div>
        </div>
    </main>

    <!-- Sidebar Derecha: Chat y Reglas -->
    <aside class="w-80 bg-panelDark border-l border-slate-800 flex flex-col">
        <!-- Header Chat -->
        <div class="h-14 border-b border-slate-800 flex items-center justify-between px-4">
            <div class="flex items-center gap-2 text-gray-400 text-sm">
                <i class="fa-solid fa-users"></i> <span id="contadorUsuarios">0</span>
            </div>
            <div class="flex gap-3 text-gray-400">
                <button class="hover:text-white"><i class="fa-solid fa-music"></i></button>
                <button class="hover:text-white"><i class="fa-solid fa-volume-xmark"></i></button>
            </div>
        </div>

        <!-- Área de mensajes / Reglas estáticas (Estilo imagen) -->
        <div class="flex-1 overflow-y-auto p-4 space-y-3" id="chatMessages">
            <div class="text-center mb-6">
                <i class="fa-solid fa-shield text-accentGold text-2xl mb-2"></i>
                <h4 class="font-bold text-sm text-gray-300">Reglas de chat</h4>
            </div>
            
            <div class="bg-slate-800/40 border border-slate-700/50 rounded-lg p-3 text-right">
                <div class="flex justify-end items-center gap-2 mb-1">
                    <span class="text-xs font-bold text-gray-300">El respeto es obligatorio</span>
                    <span class="w-4 h-4 rounded bg-slate-700 text-[10px] flex items-center justify-center text-gray-400">1</span>
                </div>
                <p class="text-[10px] text-gray-500">Cualquier insulto, blasfemia o menosprecio hacia otros = prohibición inmediata.</p>
            </div>
            <!-- Los mensajes reales del chat se añadirán aquí mediante JS -->
        </div>

        <!-- Input Chat -->
        <div class="p-4 border-t border-slate-800 bg-[#0a0f24]">
            <form onsubmit="enviarMensaje(event)" class="relative flex items-center">
                <button type="button" class="absolute left-3 text-gray-500 hover:text-gray-300"><i class="fa-solid fa-microphone"></i></button>
                <input type="text" id="chatInput" placeholder="Escribe aquí..." class="w-full bg-slate-800/80 text-sm text-white rounded-full py-3 pl-10 pr-12 outline-none border border-slate-700 focus:border-indigo-500 placeholder-gray-600">
                <button type="submit" class="absolute right-3 text-indigo-500 hover:text-indigo-400"><i class="fa-solid fa-paper-plane"></i></button>
            </form>
        </div>
    </aside>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBgh5vREimBuNfQ2fJACahZyfze3upFNKg",
            authDomain: "billar-gz.firebaseapp.com",
            databaseURL: "https://billar-gz-default-rtdb.firebaseio.com",
            projectId: "billar-gz",
            storageBucket: "billar-gz.firebasestorage.app",
            messagingSenderId: "897124469055",
            appId: "1:897124469055:web:f19b6b8aad429ea9036b8a"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        
        const urlParams = new URLSearchParams(window.location.search);
        const roomId = urlParams.get('id');

        if(!roomId) window.location.href = 'index.html';

        auth.onAuthStateChanged((user) => {
            if (!user) { window.location.href = 'index.html'; } 
            else {
                // Setear datos visuales del usuario
                db.ref('usuarios/' + user.uid).once('value').then(snap => {
                    const datos = snap.val();
                    document.getElementById('miNombre').innerText = datos?.nombre || 'Jugador';
                    document.getElementById('miId').innerText = 'ID: ' + user.uid.substring(0,8);
                    
                    // Registrar presencia en la sala
                    const presenciaRef = db.ref(`salas/${roomId}/jugadores_activos/${user.uid}`);
                    presenciaRef.set({ nombre: datos?.nombre || 'Jugador', timestamp: firebase.database.ServerValue.TIMESTAMP });
                    presenciaRef.onDisconnect().remove();
                });

                iniciarChat(user);
            }
        });

        function enviarMensaje(e) {
            e.preventDefault();
            const input = document.getElementById('chatInput');
            if(input.value.trim() === '') return;
            
            db.ref(`salas/${roomId}/chat`).push({
                uid: auth.currentUser.uid,
                nombre: document.getElementById('miNombre').innerText,
                mensaje: input.value,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });
            input.value = '';
        }

        function iniciarChat(user) {
            const chatBox = document.getElementById('chatMessages');
            db.ref(`salas/${roomId}/chat`).limitToLast(50).on('child_added', (snapshot) => {
                const msg = snapshot.val();
                const isMe = msg.uid === user.uid;
                const align = isMe ? 'text-right' : 'text-left';
                const color = isMe ? 'text-indigo-400' : 'text-emerald-400';
                
                chatBox.innerHTML += `
                    <div class="${align} mb-2">
                        <span class="${color} text-xs font-bold">${msg.nombre}</span>
                        <p class="text-sm text-gray-300 bg-slate-800 inline-block p-2 rounded-lg max-w-[90%] break-words mt-1 border border-slate-700">${msg.mensaje}</p>
                    </div>
                `;
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }

        function salirSala() {
            if(auth.currentUser) {
                db.ref(`salas/${roomId}/jugadores_activos/${auth.currentUser.uid}`).remove().then(() => {
                    window.location.href = 'index.html';
                });
            }
        }
    </script>
</body>
</html>
